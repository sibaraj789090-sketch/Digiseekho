<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Radial Ambient Lights -->
  <circle cx="300" cy="200" r="350" fill="url(#glowGrad)" filter="blur(60px)"/>
  <circle cx="900" cy="450" r="300" fill="url(#glowGrad)" filter="blur(70px)"/>

  <!-- Abstract Tech Geometric Lines -->
  <g stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5" fill="none">
    <circle cx="600" cy="300" r="180" stroke-dasharray="6 6"/>
    <circle cx="600" cy="300" r="230" stroke-opacity="0.4"/>
    <circle cx="600" cy="300" r="280" stroke-dasharray="3 9" stroke-opacity="0.3"/>
    <line x1="200" y1="300" x2="1000" y2="300" stroke-dasharray="4 8" stroke-opacity="0.3"/>
    <line x1="600" y1="100" x2="600" y2="500" stroke-dasharray="4 8" stroke-opacity="0.3"/>
  </g>

  <!-- Center Icon Graphic -->
  <g transform="translate(600, 270)">
    <rect x="-48" y="-48" width="96" height="96" rx="24" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- CPU / Tech Icon in White -->
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <line x1="-14" y1="-32" x2="-14" y2="-24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-32" x2="0" y2="-24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="-32" x2="14" y2="-24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-14" y1="24" x2="-14" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="24" x2="0" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="24" x2="14" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="-14" x2="-24" y2="-14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="-24" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="-32" y1="14" x2="-24" y2="14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="-14" x2="32" y2="-14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="32" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="14" x2="32" y2="14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    DigiSeekho
  </text>
  <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Learn Technology • Discover AI • Grow Digitally
  </text>
</svg>
